<!doctype html>
<html dir="ltr" mozdisallowselectionprint moznomarginboxes>
<head>
  <meta charset="utf-8" />
  <title>PDF.js viewer</title>
  <!-- 关键：将相对资源定位到官方CDN的web目录（images/、locale/ 等） -->
  <base href="https://unpkg.com/pdfjs-dist@3.11.174/web/">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/pdfjs-dist@3.11.174/web/viewer.css" />
  <link rel="resource" type="application/l10n" href="locale/locale.properties" />
  <style>html,body{height:100%;}</style>
</head>
<body tabindex="1" class="loadingInProgress">
  <!-- 官方viewer完整DOM结构由viewer.js构建，这里无需额外内容 -->
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.js"></script>
  <script>
    // 指定 worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.js';
  </script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/web/viewer.js"></script>
  <script>
    // 若未提供 file 参数，保持默认Demo；我们不做强制拦截，便于兼容官方逻辑
    (function(){
      const u = new URL(location.href);
      if (!u.searchParams.get('file') && window.PDFViewerApplication) {
        // 不设默认，留给用户操作界面选择文件；或按需指定：
        // u.searchParams.set('file', ''); location.replace(u.toString());
      }
    })();
  </script>
</body>
</html>
