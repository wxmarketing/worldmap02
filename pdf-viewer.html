<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 阅读器</title>
  <style>
    :root { --accent:#42A529; --bg:#0f1113; --panel:#161a1d; --text:#eaeaea; --muted:#a0a0a0; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .viewer { position: fixed; inset: 0; display: grid; grid-template-rows: 56px 1fr; }
    .toolbar { display:flex; align-items:center; gap:10px; padding:8px 12px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.06); }
    .title { flex:1; font-weight:600; color: var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btn { display:inline-flex; align-items:center; justify-content:center; height:32px; padding:0 10px; border:1px solid rgba(255,255,255,.15); border-radius:8px; background:#1c2126; color:var(--text); cursor:pointer; user-select:none; }
    .btn:hover { background:#232a30; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
    .sep { width:1px; height:24px; background: rgba(255,255,255,.08); margin:0 2px; }
    .counter { color: var(--muted); font-size: 13px; }
    .canvas-wrap { position:relative; overflow:auto; background:#101315; }
    .page-canvas { display:block; margin: 16px auto; background:#fff; box-shadow: 0 2px 18px rgba(0,0,0,.35); }
    .hint { position:absolute; right:12px; bottom:8px; color:#888; font-size:12px; }
    @media (max-width: 680px) {
      .title { display:none; }
    }
  </style>
</head>
<body>
<div class="viewer">
  <div class="toolbar">
    <div class="title" id="pdfTitle">PDF 阅读器</div>
    <button class="btn" id="prevBtn">上一页</button>
    <span class="counter"><span id="pageNum">1</span> / <span id="pageCount">0</span></span>
    <button class="btn" id="nextBtn">下一页</button>
    <div class="sep"></div>
    <button class="btn" id="zoomOut">-</button>
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="fitWidth">适宽</button>
    <button class="btn" id="fitPage">整页</button>
    <div class="sep"></div>
    <a class="btn" id="openNew" target="_blank" rel="noopener noreferrer">新标签打开</a>
    <a class="btn primary" id="download" download>下载</a>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="pdfCanvas" class="page-canvas"></canvas>
    <div class="hint">快捷键：←/→ 翻页，+/- 缩放，W 适宽，P 整页</div>
  </div>
</div>

<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.js"></script>
<script>
(function(){
  const params = new URL(location.href).searchParams;
  const file = params.get('file');
  if (!file) { alert('未提供文件链接'); }
  const titleEl = document.getElementById('pdfTitle');
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const openNew = document.getElementById('openNew');
  const download = document.getElementById('download');
  const pageNumEl = document.getElementById('pageNum');
  const pageCountEl = document.getElementById('pageCount');

  // 基本状态
  let pdfDoc = null, pageNum = 1, scale = 1.1, fitMode = 'width';

  // 绑定外链
  openNew.href = file; download.href = file;

  // 加载 pdf.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.js';

  // 自适应缩放
  function computeFitScale(page, mode){
    const wrap = document.getElementById('canvasWrap');
    const viewport = page.getViewport({ scale: 1 });
    const pad = 32; // 与容器边距
    const availW = Math.max(100, wrap.clientWidth - pad);
    const availH = Math.max(100, wrap.clientHeight - pad);
    const sW = availW / viewport.width;
    const sH = availH / viewport.height;
    return mode === 'page' ? Math.min(sW, sH) : sW;
  }

  async function renderPage(num){
    const page = await pdfDoc.getPage(num);
    if (fitMode === 'width' || fitMode === 'page') {
      scale = computeFitScale(page, fitMode === 'page' ? 'page' : 'width');
    }
    const viewport = page.getViewport({ scale });
    canvas.width = viewport.width; canvas.height = viewport.height;
    const renderContext = { canvasContext: ctx, viewport };
    await page.render(renderContext).promise;
    pageNumEl.textContent = num;
  }

  async function queueRender(num){
    if (num < 1 || num > pdfDoc.numPages) return;
    pageNum = num; await renderPage(pageNum);
  }

  // 控件
  document.getElementById('prevBtn').onclick = ()=> queueRender(pageNum - 1);
  document.getElementById('nextBtn').onclick = ()=> queueRender(pageNum + 1);
  document.getElementById('zoomIn').onclick = ()=> { fitMode='free'; scale = Math.min(scale*1.15, 6); queueRender(pageNum); };
  document.getElementById('zoomOut').onclick = ()=> { fitMode='free'; scale = Math.max(scale/1.15, 0.2); queueRender(pageNum); };
  document.getElementById('fitWidth').onclick = ()=> { fitMode='width'; queueRender(pageNum); };
  document.getElementById('fitPage').onclick = ()=> { fitMode='page'; queueRender(pageNum); };
  window.addEventListener('resize', ()=>{ if (pdfDoc) queueRender(pageNum); });

  // 快捷键
  window.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowLeft') queueRender(pageNum - 1);
    else if (e.key === 'ArrowRight') queueRender(pageNum + 1);
    else if (e.key === '+') { fitMode='free'; scale = Math.min(scale*1.15, 6); queueRender(pageNum); }
    else if (e.key === '-') { fitMode='free'; scale = Math.max(scale/1.15, 0.2); queueRender(pageNum); }
    else if (e.key.toLowerCase() === 'w') { fitMode='width'; queueRender(pageNum); }
    else if (e.key.toLowerCase() === 'p') { fitMode='page'; queueRender(pageNum); }
  });

  // 加载文档
  pdfjsLib.getDocument({ url: file, withCredentials: false }).promise
    .then(doc => {
      pdfDoc = doc; pageCountEl.textContent = doc.numPages; return renderPage(pageNum);
    })
    .catch(err => {
      console.error(err);
      alert('PDF 加载失败');
      // 后备：直接新标签打开
      location.replace(file);
    });
})();
</script>
</body>
</html>
