<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界地图看板</title>
  <!-- D3.js Library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- TopoJSON library for map data -->
  <script src="https://unpkg.com/topojson@3"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>世界地图看板</h1>
    <div class="header-center">
      <span class="header-subtitle">点击地图查看国家详细信息</span>
      <button id="night-mode-btn" class="map-reset-btn">夜间模式</button>
      <input type="text" id="country-search" placeholder="搜索国家..." class="search-input">
      <div id="autocomplete-results" class="autocomplete-results"></div>
    </div>
  </header>

  <main>
    <div class="dashboard-container">
      <div class="map-container">
        <svg id="world-map"></svg>
        <div class="map-btn-group">
          <button id="reset-zoom" class="map-reset-btn">重置</button>
          <button id="fullscreen-btn" class="map-reset-btn">全屏</button>
        </div>
      </div>
      <div class="country-detail hidden" id="country-detail">
        <div class="country-header">
          <div class="country-title">
            <span id="country-region">东南亚</span>
            <span id="country-name">印度尼西亚</span>
          </div>
          <button id="close-detail">×</button>
        </div>
        <div class="country-info">
          <div id="country-cards" class="country-cards">
            <!-- 国家信息卡片将由JavaScript动态生成 -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="admin-panel hidden" id="admin-panel">
    <div class="admin-header">
      <h2>管理面板</h2>
      <button id="close-admin">×</button>
    </div>
    <div class="admin-content">
        <div class="data-management">
          <h3>Data Management</h3>
          
          <!-- 批量上传区域 -->
          <div class="batch-upload-section">
            <h4>批量上传图片</h4>
            <div id="batch-drop-zone" class="batch-drop-zone">
              <div class="drop-zone-content">
                <p>📁 拖拽图片文件到此处，或点击选择文件</p>
                <p class="drop-zone-hint">支持全球所有国家的中文文件名：</p>
                <p class="drop-zone-hint">如 "中国-游戏市场.jpg" "美国_基础设施.png" "日本 文化习俗.gif"</p>
                <p class="drop-zone-hint">特殊格式："中国社媒.jpg"→互联网使用 "美国手机.png"→基础设施</p>
                <input type="file" id="batch-file-input" multiple accept="image/*" style="display: none;">
                <button id="select-files-btn" class="batch-btn">选择文件</button>
              </div>
            </div>
            <div id="batch-preview" class="batch-preview hidden">
              <h5>上传预览</h5>
              <div id="batch-preview-list"></div>
              <div class="batch-controls">
                <button id="batch-upload-btn" class="batch-btn primary">开始批量上传</button>
                <button id="batch-cancel-btn" class="batch-btn">取消</button>
              </div>
            </div>
          </div>
          
          <!-- 单个编辑区域 -->
          <div class="single-edit-section">
            <h4>单个编辑</h4>
            <select id="admin-country-select">
              <option value="">Select Country</option>
              <!-- Countries will be added dynamically -->
            </select>
            
            <div id="cards-editor" class="cards-editor">
              <h4>Edit Country Information Cards</h4>
              <div class="card-controls">
                <button id="add-card">添加卡片</button>
                <button id="create-template">创建模板</button>
              </div>
              <div id="card-editor-list">
                <!-- 卡片编辑表单将由JavaScript动态生成 -->
              </div>
              <button id="save-data" class="save-button">保存更改</button>
            </div>
          </div>
        </div>
    </div>
  </div>

  <!-- 图片大图查看模态框 -->
  <div id="image-modal" class="image-modal">
    <span class="image-modal-close">&times;</span>
    <img class="image-modal-content" id="modal-image">
  </div>

  <footer>
    <button id="admin-toggle">管理面板</button>
  </footer>

  <!-- Custom JS -->
  <script type="module" src="data.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="app.js"></script>
  <!-- 测试脚本 - 自动点击美国以显示国家详情面板 -->
  <script type="module" src="test-click.js"></script>
</body>
</html>
