<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界地图看板</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234CAF50'%3e%3cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM11 19.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3e%3c/svg%3e">
  <link rel="shortcut icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234CAF50'%3e%3cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM11 19.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3e%3c/svg%3e">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234CAF50'%3e%3cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM11 19.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3e%3c/svg%3e">
  
  <!-- D3.js Library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- TopoJSON library for map data -->
  <script src="https://unpkg.com/topojson@3"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>世界地图看板</h1>
    <div class="header-center">
      <span class="header-subtitle">点击地图查看国家详细信息</span>
      <button id="night-mode-btn" class="map-reset-btn">夜间模式</button>
    </div>
  </header>
  
  <!-- 搜索框区域 -->
  <div class="search-section">
    <div class="search-container">
      <input type="text" id="country-search" placeholder="搜索国家...." class="modern-search-input">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </div>
      <div id="autocomplete-results" class="autocomplete-results hidden"></div>
    </div>
  </div>

  <main>
    <div class="dashboard-container">
      <div class="map-container">
        <svg id="world-map"></svg>
        <div class="map-btn-group">
          <button id="reset-zoom" class="map-reset-btn">重置</button>
          <button id="fullscreen-btn" class="map-reset-btn">全屏</button>
        </div>
      </div>
      <div class="country-detail hidden" id="country-detail">
        <div class="country-header">
          <div class="country-title">
            <span id="country-region">东南亚</span>
            <span id="country-name">印度尼西亚</span>
          </div>
          <button id="close-detail">×</button>
        </div>
        <div class="country-info">
          <div id="country-cards" class="country-cards">
            <!-- 国家信息卡片将由JavaScript动态生成 -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="admin-panel hidden" id="admin-panel">
    <div class="admin-header">
      <h2>管理面板</h2>
      <button id="close-admin">×</button>
    </div>
    <div class="admin-content">
        <div class="data-management">
          <h3>数据管理</h3>
          
          <!-- 批量上传区域 -->
          <div class="batch-upload-section">
            <h4>批量上传图片</h4>
            <div id="batch-drop-zone" class="batch-drop-zone">
              <div class="drop-zone-content">
                <p>📁 拖拽图片文件到此处，或点击选择文件</p>
                <p class="drop-zone-hint">支持全球所有国家的中文文件名：</p>
                <p class="drop-zone-hint">如 "中国-游戏市场.jpg" "美国_基础设施.png" "日本 文化习俗.gif"</p>
                <p class="drop-zone-hint">特殊格式："中国社媒.jpg"→互联网使用 "美国手机.png"→基础设施</p>
                <input type="file" id="batch-file-input" multiple accept="image/*" style="display: none;">
                <button id="select-files-btn" class="batch-btn">选择文件</button>
              </div>
            </div>
            <div id="batch-preview" class="batch-preview hidden">
              <h5>上传预览</h5>
              <div id="batch-preview-list"></div>
              <div class="batch-controls">
                <button id="batch-upload-btn" class="batch-btn primary">开始批量上传</button>
                <button id="batch-cancel-btn" class="batch-btn">取消</button>
              </div>
            </div>
          </div>
          
          <!-- 单个编辑区域 -->
          <div class="single-edit-section">
            <h4>单个编辑</h4>
            <select id="admin-country-select">
              <option value="">选择国家</option>
              <!-- 国家选项将由JavaScript动态生成 -->
            </select>
            
            <div id="cards-editor" class="cards-editor">
              <h4>编辑国家信息卡片</h4>
              <div class="card-controls">
                <button id="add-card">添加卡片</button>
                <button id="create-template">创建模板</button>
              </div>
              <div id="card-editor-list">
                <!-- 卡片编辑表单将由JavaScript动态生成 -->
              </div>
              <button id="save-data" class="save-button">保存更改</button>
            </div>
          </div>
        </div>
    </div>
  </div>

  <!-- 图片大图查看模态框 -->
  <div id="image-modal" class="image-modal">
    <span class="image-modal-close">&times;</span>
    <img class="image-modal-content" id="modal-image">
  </div>

  <footer>
    <button id="admin-toggle">管理面板</button>
  </footer>

  <!-- Custom JS -->
  <script type="module" src="data.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="app.js"></script>
  <!-- 测试脚本 - 自动点击美国以显示国家详情面板 -->
  <script type="module" src="test-click.js"></script>

  <!-- PDF 阅读抽屉（M1）-->
  <div id="pdf-overlay" class="pdf-overlay hidden"></div>
  <div id="pdf-drawer" class="pdf-drawer hidden" aria-hidden="true" role="dialog" aria-label="PDF 阅读器">
    <div class="pdf-toolbar">
      <div class="pdf-title" id="pdf-title">PDF 报告</div>
      <div class="pdf-actions">
        <a id="pdf-open-new" class="pdf-icon-btn" target="_blank" rel="noopener" aria-label="新标签打开" title="新标签打开">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v7h-7"/><path d="M3 10v11h11"/>
          </svg>
        </a>
        <a id="pdf-download" class="pdf-icon-btn" download aria-label="下载" title="下载">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M5 21h14"/>
          </svg>
        </a>
        <button id="pdf-ai-read" class="pdf-icon-btn" aria-label="帮我读" title="帮我读">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 7H20"/>
            <path d="M2 9h16v6H2z"/>
          </svg>
        </button>
        <button id="pdf-close" class="pdf-icon-btn primary" aria-label="关闭" title="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <iframe id="pdf-frame" class="pdf-frame" title="PDF 文档" loading="lazy"></iframe>
  </div>

  <!-- AI 助手抽屉 -->
  <div id="ai-overlay" class="pdf-overlay hidden"></div>
  <div id="ai-drawer" class="pdf-drawer hidden" aria-hidden="true" role="dialog" aria-label="AI 助手">
    <div class="pdf-toolbar">
      <div class="pdf-title" id="ai-title">AI 助手</div>
      <div class="pdf-actions">
        <button id="ai-close" class="pdf-icon-btn primary" aria-label="关闭" title="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="ai-body" class="ai-body">
      <div class="ai-hint">首次使用会先读取报告文本并生成要点，请稍候…</div>
      <div id="ai-summary" class="ai-summary"></div>
      <div class="ai-qa">
        <input id="ai-question" class="ai-input" placeholder="针对这份报告提问（例如：市场规模与增速？）"/>
        <button id="ai-ask" class="pdf-icon-btn primary" title="提问" aria-label="提问">?
        </button>
      </div>
    </div>
  </div>
</body>
</html>
